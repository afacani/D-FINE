task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 7
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection          
    img_folder: /storage/irem/datasets_scriptie/unified_dataset/train
    ann_file: /storage/irem/datasets_scriptie/unified_dataset/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: RandomHorizontalFlip, p: 0.5}
        - {type: RandomPhotometricDistort, p: 1.0}
        - {type: ConvertPILImage, dtype: 'float32', scale: False}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /storage/irem/datasets_scriptie/unified_dataset/valid
    ann_file: /storage/irem/datasets_scriptie/unified_dataset/annotations/valid.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: False}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction